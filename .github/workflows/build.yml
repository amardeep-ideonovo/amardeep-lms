name: Build

# Runs alongside the BDD workflow on every PR to main. Every job here is a
# REQUIRED check in the protect-main repo ruleset (lint included since the
# repo-wide Prettier sweep; its ESLint step stays warning-first — see the
# lint job comment).
#
# The goal is to stop "merged green, broke on deploy" — typecheck/bundle
# regressions in admin/web/mobile that BDD's API-only check misses.

on:
  pull_request:
    branches: [main]

jobs:
  # Repo-wide ESLint (root flat config). Warning-first baseline: the job fails
  # only on errors (no-unused-vars, rules-of-hooks, and the always-error core
  # rules); the promise-safety rules warn until the backlog is ratcheted down.
  # Prisma generate runs first so type-aware rules see real Prisma promise
  # types instead of `any` (a missing client would silently blind
  # no-floating-promises on every prisma.* call).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: ESLint
        run: npm run lint
      # The whole repo was prettier-formatted in one sweep; this keeps it that
      # way (drift shows up here, not in unrelated PR diffs).
      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: TypeCheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Workspaces with a tsconfig but no full build elsewhere. The API
        # is covered by `nest build` in the BDD workflow; admin, web and
        # control-plane are covered by their `next build` jobs below
        # (`next build` type-checks the whole project, so a matrix entry
        # for them would double-spend CI minutes for no extra signal).
        workspace: [mobile, puck, ui, bdd, db]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: tsc --noEmit
        run: |
          case "${{ matrix.workspace }}" in
            # mobile must run ITS OWN compiler (TS 6 + nested React 19 types);
            # the root-hoisted tsc belongs to the Next apps and would mask
            # RN 0.85 type errors.
            mobile) cd apps/mobile && exec npx tsc --noEmit -p tsconfig.json ;;
            puck)   PROJECT=packages/puck/tsconfig.json ;;
            ui)     PROJECT=packages/ui/tsconfig.json ;;
            bdd)    PROJECT=packages/bdd/tsconfig.json ;;
            db)     PROJECT=packages/db/tsconfig.json ;;
          esac
          npx tsc --noEmit -p "$PROJECT"

  # apps/mobile carries node:test unit specs (src/**/*.spec.ts) — regression
  # guards like the malformed-cached-config launch crash (theme.spec.ts) and the
  # Switch-academy token-overtake race (token-store.spec.ts). Its own job, not a
  # step inside TypeCheck (mobile), so it is a visible required-able check and a
  # tsc failure can't mask a test regression (or vice versa). tsconfig.json
  # excludes *.spec.ts (the RN project has no node types), so tsc never runs
  # them — this is the only thing that does.
  test-mobile:
    name: Test (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # No `prisma generate` needed: the specs' runtime graph is pure TS
      # (token-store.ts has no imports; theme.ts's only import is a type-only
      # `import type ... from "@lms/types"`, erased by transpile-only), so no
      # @prisma/client or react-native module is loaded.
      - name: Unit tests (mobile)
        run: npm run -w @lms/mobile test

  # apps/api carries node:test unit specs (23 files): the crypto round-trip
  # guards, JWT/reset/download tokens, throttler tracker, storage-dir boot
  # rules, destructive-op invariants — and deploy-pins.spec.ts, the cross-file
  # contract test asserting every declared storage dir stays pinned in
  # deploy/instance/docker-compose.instance.yml and apps/api/Dockerfile.
  # Until this job existed they ran only on dev machines. `prisma generate`
  # is needed so service files' Prisma types resolve under ts-node; the specs
  # themselves inject hand-rolled literal mocks, so no DATABASE_URL and no
  # live Postgres/Redis are required.
  test-api:
    name: Test (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: Unit tests (api)
        run: npm run -w @lms/api test

  build-admin:
    name: Next build (admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: next build
        run: npm run -w @lms/admin build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  build-web:
    name: Next build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: next build
        run: npm run -w @lms/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  # The operator console was the one app CI neither type-checked nor built —
  # a bundle/type regression only surfaced when someone next deployed it.
  # `next build` type-checks the whole project (same coverage rationale as
  # admin/web, see the TypeCheck matrix comment). No NEXT_PUBLIC_API_URL:
  # the console reads its own env at runtime and builds without one.
  build-control-plane:
    name: Next build (control-plane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: next build
        run: npm run -w @lms/control-plane build
