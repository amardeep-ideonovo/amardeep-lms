# DEV-ONLY dependencies (local Postgres + Redis with default credentials,
# ports published to the host). Nothing production runs from this file:
# the single-VPS prod stack is deploy/docker-compose.yml and per-tenant
# instances are deploy/instance/docker-compose.instance.yml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - lms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - lms_redis:/data

volumes:
  lms_pg:
  lms_redis:
